name: Online-Server (Cloudflare) einrichten

on:
  workflow_dispatch:
  push:
    paths:
      - 'worker/**'
      - '.github/workflows/online-server.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Server bei Cloudflare hochladen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Das Secret CLOUDFLARE_API_TOKEN fehlt (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          cd worker
          npx --yes wrangler@3 deploy 2>&1 | tee ../deploy.log
      - name: Server-Adresse ins Spiel schreiben
        run: |
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then echo "::error::Keine workers.dev-Adresse gefunden – siehe Log oben."; exit 1; fi
          echo "Online-Server: $URL"
          printf '// Wird automatisch vom GitHub-Workflow geschrieben\nwindow.IE_SERVER = "%s";\n' "$URL" > js/server-config.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/server-config.js
          git diff --cached --quiet || (git commit -m "Online-Server-Adresse eingetragen" && git push)
